<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Aksu Çınaraltı | QR Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241a14;
    --bg2:#2f231b;
    --paper:#f4ead9;
    --paper2:#eee0c8;
    --ink:#2a1f16;
    --ink-soft:#5b4a3a;
    --copper:#b8703f;
    --ember:#9c3b22;
    --olive:#6f7d4e;
    --wheat:#b9871f;
    --teal:#3c7a72;
    --cream:#f1e6d8;
    --line:rgba(42,31,22,0.25);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Work Sans',sans-serif;}
  .shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

  /* HEADER */
  header{padding:36px 24px 22px;text-align:center;border-bottom:1px solid rgba(241,230,216,0.08);}
  header .brand{font-family:'Zilla Slab',serif;font-weight:700;font-size:2.1rem;letter-spacing:0.5px;color:var(--cream);}
  header .brand em{font-style:normal;color:var(--copper);}
  header .tag{margin-top:6px;font-size:0.85rem;color:rgba(241,230,216,0.55);letter-spacing:0.3px;}

  /* CATEGORY NAV */
  nav.cats{display:flex;gap:8px;padding:16px 16px 6px;overflow-x:auto;}
  nav.cats button{
    flex:0 0 auto;padding:10px 16px;border-radius:999px;border:1px solid rgba(241,230,216,0.18);
    background:transparent;color:var(--cream);font-family:'Work Sans',sans-serif;font-size:0.88rem;font-weight:500;
    display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .2s ease;white-space:nowrap;
  }
  nav.cats button.active{background:var(--copper);border-color:var(--copper);color:#fff;}
  nav.cats button .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;}

  /* MENU PAPER PANEL */
  main{padding:14px 16px 40px;flex:1;}
  .paper{background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:14px;padding:0 0 8px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,0.35);overflow:hidden;}
  .banner{width:100%;height:108px;display:block;}
  .cat-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;padding:18px 20px 0;}
  .cat-title h2{font-family:'Zilla Slab',serif;font-size:1.3rem;margin:0;font-weight:600;}
  .cat-title span.sub{font-size:0.75rem;color:var(--ink-soft);}
  .cat-rule{height:2px;width:46px;border-radius:2px;margin:2px 20px 14px;}
  .item-list{padding:0 20px;}
  .item{padding:14px 0;border-bottom:1px dashed var(--line);display:flex;gap:12px;}
  .item:last-child{border-bottom:none;}
  .item-thumb{flex:0 0 auto;width:58px;height:58px;border-radius:10px;overflow:hidden;background:rgba(42,31,22,0.08);display:flex;align-items:center;justify-content:center;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-thumb svg{width:60%;height:60%;opacity:0.55;}
  .item-body{flex:1;min-width:0;}
  .item-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .item-name{font-family:'Zilla Slab',serif;font-weight:600;font-size:1.0rem;}
  .item-weight{font-size:0.7rem;color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .leader{flex:1;border-bottom:1px dotted var(--ink-soft);opacity:.5;margin:0 6px;transform:translateY(-3px);}
  .item-price{font-family:'Zilla Slab',serif;font-weight:700;font-size:1.0rem;white-space:nowrap;}
  .item-desc{font-size:0.8rem;color:var(--ink-soft);margin-top:3px;font-style:italic;}
  .sold-out{opacity:0.45;}
  .sold-out .item-price::after{content:" (tükendi)";font-size:0.65rem;font-style:italic;font-weight:400;}

  .empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:0.9rem;}
</style>

};

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function renderCatNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = '';
  defaultData.categories.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = c.id === activeCat ? 'active' : '';
    btn.innerHTML = `<span>${c.icon}</span> ${c.name}`;
    btn.onclick = ()=>{ activeCat = c.id; renderCatNav(); renderMenu(); };
    nav.appendChild(btn);
  });
}

function renderMenu(){
  const wrap = document.getElementById('menuList');
  const cat = defaultData.categories.find(c=>c.id === activeCat) || defaultData.categories[0];
  const items = defaultData.items.filter(i=>i.cat === activeCat);
  let html = banners[cat.id] || '';
  html += `<div class="cat-title"><h2>${cat.icon} ${cat.name}</h2><span class="sub">${items.length} çeşit</span></div>
              <div class="cat-rule" style="background:${accentVar(cat.accent)}"></div>`;
  if(items.length === 0){
    html += `<div class="empty">Bu kategoriye henüz ürün eklenmedi.</div>`;
  } else {
    html += `<div class="item-list">`;
    items.forEach(i=>{
      const thumb = i.image
        ? `<img src="${escapeAttr(i.image)}" alt="${escapeAttr(i.name)}" loading="lazy" onerror="this.parentElement.innerHTML=fallbackIcons['${cat.id}']">`
        : (fallbackIcons[cat.id] || '');
      html += `<div class="item ${i.active === false ? 'sold-out' : ''}">
        <div class="item-thumb">${thumb}</div>
        <div class="item-body">
          <div class="item-row">
            <span class="item-name">${i.name}${i.weight ? `<span class="item-weight">(${i.weight})</span>` : ''}</span>
            <span class="leader"></span>
            <span class="item-price">${Number(i.price).toLocaleString('tr-TR')} TL</span>
          </div>
          ${i.desc ? `<div class="item-desc">${i.desc}</div>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  wrap.innerHTML = html;
}

renderCatNav();
renderMenu();
