<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aksu Çınaraltı | QR Dijital Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

<base href="/qr/aksu/">

<style>
  :root {
    --bg-main: #14110f;
    --bg-card: #1e1916;
    --surface: #27211d;
    --surface-hover: #322b26;
    
    --primary: #c97a3e;
    --primary-light: #e4975e;
    --primary-glow: rgba(201, 122, 62, 0.25);
    
    --accent-gold: #d4af37;
    --accent-green: #2d5a3e;
    
    --text-main: #f8f4eb;
    --text-muted: #a69888;
    --text-dim: #7a6e60;
    
    --border: rgba(248, 244, 235, 0.08);
    --border-active: rgba(201, 122, 62, 0.4);
    
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-full: 9999px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(201, 122, 62, 0.12) 0%, transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(45, 90, 62, 0.08) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .app-container {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: 50px;
  }

  /* --- HEADER & HERO --- */
  header {
    padding: 36px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }

  .logo-wrapper {
    width: 100px;
    height: 100px;
    border-radius: var(--radius-full);
    background: #ffffff;
    padding: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1), 0 0 20px var(--primary-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    transition: transform 0.3s ease;
  }

  .logo-wrapper:hover {
    transform: scale(1.04) rotate(1deg);
  }

  .logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: var(--radius-full);
  }

  .brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.1rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.5px;
    line-height: 1.15;
  }

  .brand-title span {
    color: var(--primary-light);
    font-style: italic;
  }

  .brand-subtitle {
    margin-top: 8px;
    font-size: 0.88rem;
    color: var(--text-muted);
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    line-height: 1.4;
  }

  .brand-subtitle span.dot {
    width: 4px;
    height: 4px;
    background-color: var(--primary);
    border-radius: 50%;
    opacity: 0.7;
  }

  /* --- STICKY CATEGORY NAVIGATION (YATAY SCROLL DÜZELTİLDİ) --- */
  .nav-wrapper {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(20, 17, 15, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  nav.cats {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 2px 16px;
    scroll-behavior: smooth;
  }

  nav.cats::-webkit-scrollbar {
    display: none;
  }

  nav.cats button {
    flex: 0 0 auto;
    padding: 10px 18px;
    border-radius: var(--radius-full);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  nav.cats button .cat-icon {
    font-size: 1.1rem;
    line-height: 1;
  }

  nav.cats button.active {
    background: linear-gradient(135deg, var(--primary) 0%, #a45321 100%);
    border-color: var(--primary-light);
    color: #ffffff;
    box-shadow: 0 4px 16px var(--primary-glow);
    transform: translateY(-1px);
  }

  /* --- MENU LIST & HEADERS --- */
  main {
    padding: 18px 16px;
    flex: 1;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 4px 18px 4px;
  }

  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-header .count-badge {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--primary-light);
    background: rgba(201, 122, 62, 0.15);
    padding: 4px 10px;
    border-radius: var(--radius-full);
    border: 1px solid rgba(201, 122, 62, 0.2);
  }

  .item-grid {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* 1. YEMEKLER İÇİN BÜYÜK KART TASARIMI */
  .menu-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    transition: transform 0.2s ease;
  }

  .menu-card:active {
    transform: scale(0.985);
  }

  .card-thumb-wrap {
    width: 100%;
    height: 180px;
    position: relative;
    background: #110e0c;
    overflow: hidden;
  }

  .card-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-thumb-wrap::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    background: linear-gradient(to top, var(--bg-card) 0%, transparent 100%);
    pointer-events: none;
  }

  .badge-portion-overlay {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    background: rgba(20, 17, 15, 0.82);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(248, 244, 235, 0.15);
    color: #f8f4eb;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-full);
  }

  .card-details {
    padding: 14px 18px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.2;
  }

  .card-price {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.22rem;
    font-weight: 800;
    color: var(--primary-light);
    white-space: nowrap;
  }

  .card-price span.currency {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--primary);
    margin-left: 2px;
  }

  .card-desc {
    font-size: 0.86rem;
    color: var(--text-muted);
    line-height: 1.45;
    font-weight: 400;
  }

  /* 2. İÇECEKLER İÇİN KOMPAKT & ŞIK TASARIM */
  .item-grid.compact-grid {
    gap: 10px;
  }

  .compact-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .compact-card:active {
    transform: scale(0.985);
    background: var(--surface);
  }

  .compact-thumb {
    width: 64px;
    height: 64px;
    flex: 0 0 64px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #110e0c;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .compact-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .compact-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .compact-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .compact-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .compact-portion {
    display: inline-block;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-dim);
  }

  .compact-price {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--primary-light);
    white-space: nowrap;
  }

  .compact-desc {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fallback-icon {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    opacity: 0.4;
    padding: 14px;
  }

  .fallback-icon svg {
    width: 100%;
    height: 100%;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    background: var(--bg-card);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border);
  }

  footer {
    text-align: center;
    padding: 24px 20px;
    color: var(--text-dim);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="app-container">

let activeCat = 'kahvalti';

const fallbackSVGs = {
  kahvalti: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13a3 3 0 0 1 0 6h-1"/><path d="M4 8v8a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2V8"/><path d="M8 3v3M12 3v3M16 3v3"/></svg>`,
  kebap: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="2" x2="18" y2="22"/><rect x="4" y="6" width="5" height="4" rx="1"/><rect x="10" y="10" width="5" height="4" rx="1"/><rect x="15" y="15" width="5" height="4" rx="1"/></svg>`,
  firin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="14" rx="9" ry="5"/><circle cx="9" cy="12" r=".8" fill="currentColor"/><circle cx="13" cy="15" r=".8" fill="currentColor"/><circle cx="16" cy="11" r=".8" fill="currentColor"/></svg>`,
  icecekler: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 2h10l-1.5 16a3 3 0 0 1-3 2.8h-1A3 3 0 0 1 8.5 18L7 2z"/><line x1="6" y1="6" x2="18" y2="6"/><line x1="12" y1="2" x2="15" y2="-2"/></svg>`
};

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function renderCatNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = '';
  defaultData.categories.forEach(c => {
    const btn = document.createElement('button');
    btn.className = c.id === activeCat ? 'active' : '';
    btn.innerHTML = `<span class="cat-icon">${c.icon}</span> <span>${c.name}</span>`;
    btn.onclick = () => { 
      activeCat = c.id; 
      renderCatNav(); 
      renderMenu(); 
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    };
    nav.appendChild(btn);
  });
}

function renderMenu(){
  const wrap = document.getElementById('menuList');
  const cat = defaultData.categories.find(c => c.id === activeCat) || defaultData.categories[0];
  const items = defaultData.items.filter(i => i.cat === activeCat);

  let html = `
    <div class="section-header">
      <h2>${cat.name}</h2>
      <span class="count-badge">${items.length} Çeşit</span>
    </div>
  `;

  if(items.length === 0){
    html += `<div class="empty-state">Bu kategoriye ait ürün bulunamadı.</div>`;
  } else {
    // İçecekler kategorisi için kompakt ızgara, diğerleri için büyük kartlar
    const isBeverage = cat.id === 'icecekler';
    html += `<div class="item-grid ${isBeverage ? 'compact-grid' : ''}">`;
    
    items.forEach(i => {
      const fallback = `<div class="fallback-icon">${fallbackSVGs[cat.id] || ''}</div>`;
      const thumbImg = i.image
        ? `<img src="${escapeAttr(i.image)}" alt="${escapeAttr(i.name)}" loading="lazy" onerror="this.outerHTML='${escapeAttr(fallback)}'">`
        : fallback;

      if(isBeverage) {
        // İçeceklere Özel Kompakt Kart
        html += `
          <div class="compact-card ${i.active === false ? 'sold-out' : ''}">
            <div class="compact-thumb">
              ${thumbImg}
            </div>
            <div class="compact-info">
              <div class="compact-header">
                <div>
                  <span class="compact-title">${i.name}</span>
                  ${i.weight ? `<div class="compact-portion">${i.weight}</div>` : ''}
                </div>
                <div class="compact-price">
                  ${Number(i.price).toLocaleString('tr-TR')}<span class="currency">TL</span>
                </div>
              </div>
              ${i.desc ? `<div class="compact-desc">${i.desc}</div>` : ''}
            </div>
          </div>
        `;
      } else {
        // Yemeklere Özel Büyük Kart
        html += `
          <div class="menu-card ${i.active === false ? 'sold-out' : ''}">
            <div class="card-thumb-wrap">
              ${thumbImg}
              ${i.weight ? `<div class="badge-portion-overlay">${i.weight}</div>` : ''}
            </div>
            <div class="card-details">
              <div class="card-title-row">
                <div class="card-title">${i.name}</div>
                <div class="card-price">
                  ${Number(i.price).toLocaleString('tr-TR')}<span class="currency">TL</span>
                </div>
              </div>
              ${i.desc ? `<div class="card-desc">${i.desc}</div>` : ''}
            </div>
          </div>
        `;
      }
    });
    html += `</div>`;
  }
  wrap.innerHTML = html;
}

renderCatNav();
renderMenu();
</script>
</body>
</html>
